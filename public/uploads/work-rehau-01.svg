<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800' viewBox='0 0 1200 800'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a' />
      <stop offset='100%' stop-color='#1e293b' />
    </linearGradient>
    <pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'>
      <path d='M 40 0 L 0 0 0 40' fill='none' stroke='#334155' stroke-width='1' opacity='0.4'/>
    </pattern>
    <filter id='dropShadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='4' stdDeviation='8' flood-color='#000000' flood-opacity='0.6'/>
    </filter>
  </defs>
  <rect width='1200' height='800' fill='url(#bgGrad)'/>
  <rect width='1200' height='800' fill='url(#grid)'/>

  <!-- Schematic manifold pipes -->
  <g opacity='0.85'>
    <!-- Hot manifold (Red) -->
    <rect x='150' y='280' width='900' height='44' rx='10' fill='#ef4444' stroke='#f87171' stroke-width='3' filter='url(#dropShadow)'/>
    <!-- Cold manifold (Blue) -->
    <rect x='150' y='420' width='900' height='44' rx='10' fill='#0284c7' stroke='#38bdf8' stroke-width='3' filter='url(#dropShadow)'/>
    
    <!-- Vertical pipe taps -->
    <path d='M 260 280 L 260 120 M 400 280 L 400 120 M 540 280 L 540 120 M 680 280 L 680 120 M 820 280 L 820 120' stroke='#fca5a5' stroke-width='18' stroke-linecap='round'/>
    <path d='M 260 464 L 260 640 M 400 464 L 400 640 M 540 464 L 540 640 M 680 464 L 680 640 M 820 464 L 820 640' stroke='#7dd3fc' stroke-width='18' stroke-linecap='round'/>

    <!-- Brass valves / taps -->
    <circle cx='260' cy='200' r='20' fill='#eab308' stroke='#ca8a04' stroke-width='3'/>
    <circle cx='400' cy='200' r='20' fill='#eab308' stroke='#ca8a04' stroke-width='3'/>
    <circle cx='540' cy='200' r='20' fill='#eab308' stroke='#ca8a04' stroke-width='3'/>
    <circle cx='680' cy='200' r='20' fill='#eab308' stroke='#ca8a04' stroke-width='3'/>
    <circle cx='820' cy='200' r='20' fill='#eab308' stroke='#ca8a04' stroke-width='3'/>
    
    <!-- Pressure gauge -->
    <circle cx='180' cy='220' r='38' fill='#ffffff' stroke='#eab308' stroke-width='4' filter='url(#dropShadow)'/>
    <circle cx='180' cy='220' r='30' fill='none' stroke='#0f172a' stroke-width='2'/>
    <line x1='180' y1='220' x2='196' y2='204' stroke='#ef4444' stroke-width='3' stroke-linecap='round'/>
    <text x='180' y='238' font-family='sans-serif' font-weight='bold' font-size='10' fill='#0f172a' text-anchor='middle'>4.0 BAR</text>
  </g>

  <!-- Photo Title card -->
  <rect x='100' y='60' width='540' height='70' rx='16' fill='#0b1329' fill-opacity='0.9' stroke='#38bdf8' stroke-width='1.5'/>
  <text x='125' y='94' font-family='sans-serif' font-weight='900' font-size='20' fill='#ffffff'>Разводка труб Rehau Rautitan flex 16-20 мм</text>
  <text x='125' y='116' font-family='sans-serif' font-weight='600' font-size='13' fill='#38bdf8'>Шумопоглощающая теплоизоляция и пресс-фитинги</text>

  <!-- Official 'СантехПро' Watermark Badge (bottom right) -->
  <g transform='translate(880, 715)'>
    <rect x='0' y='0' width='280' height='56' rx='16' fill='#0b1329' fill-opacity='0.85' stroke='#38bdf8' stroke-width='2'/>
    <!-- Cyan droplet icon -->
    <circle cx='28' cy='28' r='12' fill='#06b6d4'/>
    <circle cx='24' cy='24' r='4' fill='#ffffff'/>
    <text x='54' y='36' font-family='sans-serif' font-weight='900' font-size='22' fill='#ffffff'>СантехПро</text>
    <text x='186' y='35' font-family='sans-serif' font-weight='700' font-size='14' fill='#38bdf8'>• Проверено</text>
  </g>
</svg>