<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="contractBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1329" />
    </linearGradient>

    <!-- Key Badge Gradient (The Iconic SantehPro Key) -->
    <linearGradient id="contractKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="38%" stop-color="#ef4444" />
      <stop offset="72%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Deep Ambient Glow -->
    <filter id="keyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#f43f5e" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <radialGradient id="orbGlowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbGlowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#contractBg)" />

  <!-- Ambient Glow -->
  <circle cx="260" cy="315" r="400" fill="url(#orbGlowRed)" />
  <circle cx="1020" cy="220" r="380" fill="url(#orbGlowBlue)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
  </g>

  <!-- LEFT: The Iconic Universal Key Squircle Badge (210x210) -->
  <g transform="translate(100, 210)" filter="url(#keyGlow)">
    <rect 
      x="0" 
      y="0" 
      width="210" 
      height="210" 
      rx="50" 
      fill="url(#contractKeyGrad)" 
      stroke="rgba(255, 255, 255, 0.4)" 
      stroke-width="4" 
    />
    <!-- Wrench icon centered inside 210x210 -->
    <g transform="translate(44.5, 44.5) scale(5.04)">
      <path 
        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.35" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
    </g>
  </g>

  <!-- RIGHT: Typography & Official Document Details -->
  <g transform="translate(360, 0)">
    <!-- Document Status Pill -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="280" height="38" rx="19" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399" letter-spacing="0.5">
        ОФИЦИАЛЬНЫЙ ДОГОВОР ПОДРЯДА
      </text>
    </g>

    <!-- Main Title: Договор подряда -->
    <g transform="translate(0, 245)" filter="url(#textGlow)">
      <text font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.5" fill="#ffffff">
        Договор подряда
      </text>
    </g>

    <!-- Brand Name: СантехПро -->
    <g transform="translate(0, 310)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">
        <tspan fill="#94a3b8">на платформе </tspan><tspan fill="#f43f5e">Сантех</tspan><tspan fill="#38bdf8">Про</tspan>
      </text>
    </g>

    <!-- Subtitle: Подписание онлайн -->
    <text x="0" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
      Электронное подписание со смартфона • Акт сдачи-приёмки • Гарантия
    </text>

    <!-- 3 Feature Badges -->
    <g transform="translate(0, 420)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="44" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="110" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">✍️ Подпись в 1 клик</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(235, 0)">
        <rect width="250" height="44" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="125" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">🛡️ Защита мастера и клиента</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(500, 0)">
        <rect width="220" height="44" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="110" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">📑 Юридическая сила</text>
      </g>
    </g>

    <!-- Web Link -->
    <text x="0" y="525" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="0.5">
      santehpro.info
    </text>
  </g>
</svg>
