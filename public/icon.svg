<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background luxury gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border red to blue gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Red text gradient matching banner -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Vibrant Blue text gradient matching banner -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Top badge ambient glow -->
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Drop gradient for emblem -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Shadow filter for clean depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle with subtle glow border -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="120" cy="120" r="140" fill="#ef4444" opacity="0.08" filter="blur(20px)" />
  <circle cx="392" cy="392" r="140" fill="#3b82f6" opacity="0.08" filter="blur(20px)" />

  <!-- Top Badge: Mini Wrench Icon in Red-to-Blue Box -->
  <g transform="translate(64, 52)" filter="url(#shadow)">
    <rect width="64" height="64" rx="18" fill="url(#emblemGrad)" />
    <!-- Wrench icon white -->
    <path d="M43.7 20.3a3 3 0 0 0 0 4.2l3.6 3.6a3 3 0 0 0 4.2 0l7.5-7.5a12 12 0 0 1-15.9 15.9l-13.8 13.8a4.2 4.2 0 0 1-6-6l13.8-13.8a12 12 0 0 1 15.9-15.9l-7.5 7.5z"
          transform="translate(-14, -4) scale(0.9)"
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Line: «Сантех» aligned with top badge -->
  <!-- Positioned prominently at upper-middle -->
  <text x="144" y="104"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="-1.5"
        fill="url(#redGrad)"
        filter="url(#shadow)">Сантех</text>

  <!-- Center Decorative Technical Divider Grid Line -->
  <line x1="64" y1="210" x2="448" y2="210" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" opacity="0.5" />

  <!-- Bottom Line: «Про» shifted down and to the right -->
  <text x="448" y="380"
        text-anchor="end"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
        font-size="142"
        font-weight="900"
        letter-spacing="2"
        fill="url(#blueGrad)"
        filter="url(#shadow)">ПРО</text>

  <!-- Subtitle in Footer: «Твой карманный помощник» -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="0.5"
        fill="#94a3b8"
        opacity="0.85">Твой карманный помощник по сантехнике</text>
</svg>
