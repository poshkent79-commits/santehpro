<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142036" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>

    <!-- Squircle clip path -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>

    <!-- Subtle soft drop shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#bgGrad)" />
    
    <!-- Thin elegant border -->
    <rect x="1.5" y="1.5" width="509" height="509" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

    <!-- EMBLEM: Stylized Wrench embracing House with 4 Windows -->
    <g transform="translate(186, 70)" filter="url(#softShadow)">
      <!-- House silhouette (Right side) in Coral-Red -->
      <path d="M 45 10 
               L 115 72 
               L 100 85 
               L 100 135 
               L 55 135 
               L 55 120 
               L 85 120 
               L 85 80 
               L 45 44 
               L 20 67
               L 5 53 Z" 
            fill="#ee3b3b" />
      
      <!-- Chimney on roof -->
      <rect x="80" y="24" width="16" height="32" rx="2" fill="#ee3b3b" />

      <!-- 4 Window Panes in House -->
      <rect x="62" y="70" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="76" y="70" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="62" y="84" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="76" y="84" width="10" height="10" rx="1.5" fill="#fca5a5" />

      <!-- Wrench head and handle in Steel-Cyan embracing house (Left side) -->
      <path d="M 12 35 
               C 12 15, 32 0, 52 5 
               C 42 16, 42 32, 54 40
               C 40 48, 28 62, 35 78
               L 52 98
               C 56 102, 54 110, 48 114
               L 28 128
               C 22 132, 14 130, 10 124
               L -5 104
               C -9 98, -8 90, -2 84
               L 8 74
               C 0 62, 2 48, 12 35 Z" 
            fill="#38bdf8" />
      
      <!-- Wrench inner jaw cutout -->
      <path d="M 24 22 C 18 30, 20 42, 28 48 C 34 38, 32 26, 24 22 Z" fill="#0e1726" />
    </g>

    <!-- MAIN TITLE: САНТЕХ (Clean Red) -->
    <g filter="url(#softShadow)">
      <text x="256" y="278" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', Arial, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="2" 
            fill="#ee3838">САНТЕХ</text>
    </g>

    <!-- MAIN TITLE: ПРО (Clean Blue) -->
    <g filter="url(#softShadow)">
      <text x="256" y="372" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', Arial, sans-serif" 
            font-size="94" 
            font-weight="900" 
            letter-spacing="4" 
            fill="#3b82f6">ПРО</text>
    </g>

    <!-- SUBTITLE: Твой карманный помощник по сантехнике (Crisp White) -->
    <g filter="url(#softShadow)">
      <text x="256" y="424" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, 'SF Pro Text', Roboto, 'Segoe UI', Arial, sans-serif" 
            font-size="21" 
            font-weight="700" 
            letter-spacing="0.5" 
            fill="#ffffff">Твой карманный</text>
      <text x="256" y="454" 
            text-anchor="middle" 
            font-family="system-ui, -apple-system, 'SF Pro Text', Roboto, 'Segoe UI', Arial, sans-serif" 
            font-size="21" 
            font-weight="700" 
            letter-spacing="0.5" 
            fill="#ffffff">помощник по сантехнике</text>
    </g>
  </g>
</svg>
