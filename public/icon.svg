<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Signature Rose-Red to Indigo Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle soft shadow for the wrench -->
    <filter id="wrenchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background (matches rounded-xl / Android squircle) -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#brandGrad)" />

  <!-- Translucent White Border (border border-white/20) -->
  <rect x="3" y="3" width="506" height="506" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Centered Lucide Wrench with stroke-width 2.2 and rounded stroke linecap/linejoin -->
  <!-- 24x24 scaled by 13x (width 312, height 312, translated to cx 256, cy 256) -->
  <g transform="translate(100, 100) scale(13)" filter="url(#wrenchGlow)">
    <path
      d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>