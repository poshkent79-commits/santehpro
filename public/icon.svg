<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background luxury gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border red to blue gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Red text gradient matching banner -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Vibrant Blue text gradient matching banner -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Top badge ambient glow -->
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Drop gradient for emblem -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing border line -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Ambient background glow behind emblem -->
  <circle cx="256" cy="135" r="110" fill="url(#badgeGlow)" />

  <!-- Center-Top Emblem: Shield/Badge with Wrench & Water Droplet -->
  <g transform="translate(256, 132)">
    <!-- Rounded emblem backing -->
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#emblemGrad)" opacity="0.18" stroke="url(#borderGrad)" stroke-width="2" />
    
    <!-- Droplet background accent -->
    <path d="M0 -34 C-1 -34 -24 3 -24 18 C-24 31 -13 42 0 42 C13 42 24 31 24 18 C24 3 1 -34 0 -34 Z" fill="url(#blueGrad)" opacity="0.35" />

    <!-- Adjustable Wrench Icon (White with shadow) -->
    <g transform="rotate(-35)" filter="url(#dropShadow)">
      <!-- Handle -->
      <rect x="-7" y="-2" width="14" height="54" rx="6" fill="#ffffff" />
      <circle cx="0" cy="42" r="4" fill="#0f172a" />
      <!-- Head -->
      <path d="M -16 -2 C -18 -10, -16 -24, -4 -30 C 8 -36, 22 -30, 24 -18 C 24 -14, 18 -10, 12 -8 L 8 -16 L -4 -12 L -2 -2 Z" fill="#ffffff" />
      <!-- Highlight knurl -->
      <rect x="-5" y="10" width="10" height="4" rx="2" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Typography: «Сантех» On Top (Red) -->
  <g filter="url(#dropShadow)">
    <text x="76" y="306"
          font-family="system-ui, -apple-system, 'Liberation Sans', 'FreeSans', 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="88"
          letter-spacing="-1"
          fill="url(#redGrad)">Сантех</text>
  </g>

  <!-- Typography: «Про» Shifted Down & Slightly to the Right (Blue) -->
  <g filter="url(#dropShadow)">
    <text x="268" y="408"
          font-family="system-ui, -apple-system, 'Liberation Sans', 'FreeSans', 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="84"
          letter-spacing="2"
          fill="url(#blueGrad)">ПРО</text>
  </g>

  <!-- Decorative technical line accent below -->
  <g opacity="0.75">
    <rect x="76" y="442" width="22" height="4" rx="2" fill="#ef4444" />
    <rect x="106" y="442" width="150" height="4" rx="2" fill="#334155" />
    <rect x="268" y="442" width="168" height="4" rx="2" fill="#3b82f6" />
  </g>
</svg>
