<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background luxury navy gradient matching 1790635194201.jpg -->
    <radialGradient id="bannerBg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141f32" />
      <stop offset="50%" stop-color="#0d1624" />
      <stop offset="100%" stop-color="#070c14" />
    </radialGradient>

    <!-- 3D drop shadow filter for text and emblem -->
    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="textGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="textGlowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <linearGradient id="bannerRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7b7b" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>

    <linearGradient id="bannerBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70b0ff" />
      <stop offset="100%" stop-color="#3884ff" />
    </linearGradient>

    <linearGradient id="bannerWrench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="bannerHouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Deep dark sleek background -->
  <rect width="1200" height="675" fill="url(#bannerBg)" />
  
  <!-- Subtle decorative tech grid / particles -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Central Graphic Group -->
  <g transform="translate(600, 195)" filter="url(#bannerShadow)">
    <!-- EMBLEM: Stylized Wrench embracing House with 4 Windows -->
    <g transform="translate(-65, -120) scale(1.15)">
      <!-- House with Roof and Chimney -->
      <path d="M 45 10 
               L 115 72 
               L 100 85 
               L 100 135 
               L 55 135 
               L 55 120 
               L 85 120 
               L 85 80 
               L 45 44 
               L 20 67
               L 5 53 Z" 
            fill="url(#bannerHouse)" />
      
      <rect x="80" y="25" width="16" height="32" rx="2" fill="url(#bannerHouse)" />

      <!-- 4 Windows -->
      <rect x="62" y="72" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="76" y="72" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="62" y="86" width="10" height="10" rx="1.5" fill="#fca5a5" />
      <rect x="76" y="86" width="10" height="10" rx="1.5" fill="#fca5a5" />

      <!-- Wrench head and handle in Steel-Cyan -->
      <path d="M 12 35 
               C 12 15, 32 0, 52 5 
               C 42 16, 42 32, 54 40
               C 40 48, 28 62, 35 78
               L 52 98
               C 56 102, 54 110, 48 114
               L 28 128
               C 22 132, 14 130, 10 124
               L -5 104
               C -9 98, -8 90, -2 84
               L 8 74
               C 0 62, 2 48, 12 35 Z" 
            fill="url(#bannerWrench)" />
      
      <path d="M 24 22 C 18 30, 20 42, 28 48 C 34 38, 32 26, 24 22 Z" fill="#0d1b2a" />
    </g>
  </g>

  <!-- Title: САНТЕХ -->
  <text x="600" y="365" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
        font-size="96" 
        font-weight="900" 
        letter-spacing="6" 
        filter="url(#textGlowRed)"
        fill="url(#bannerRed)">САНТЕХ</text>

  <!-- Title: ПРО -->
  <text x="600" y="475" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
        font-size="112" 
        font-weight="900" 
        letter-spacing="8" 
        filter="url(#textGlowBlue)"
        fill="url(#bannerBlue)">ПРО</text>

  <!-- Subtitle: Твой карманный помощник по сантехнике -->
  <text x="600" y="550" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Pro Text', Roboto, 'Segoe UI', sans-serif" 
        font-size="32" 
        font-weight="600" 
        letter-spacing="1" 
        fill="#94a3b8">Твой карманный помощник по сантехнике</text>

  <!-- Official Data Exchange Watermark Badge -->
  <g transform="translate(600, 608)" opacity="0.85">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="-145" cy="0" r="4" fill="#10b981" />
    <text x="-130" y="5" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#cbd5e1">Электронный обмен: Клиент ⇄ Специалист</text>
  </g>
</svg>
