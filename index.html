  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background-color:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#f8fafc;-webkit-font-smoothing:antialiased;">
        <div style="position:relative;margin-bottom:24px;">
          <div style="position:absolute;inset:-8px;background:radial-gradient(circle,rgba(37,99,235,0.4) 0%,rgba(15,23,42,0) 70%);border-radius:50%;filter:blur(10px);animation:pulse 2s infinite ease-in-out;"></div>
          <img src="/pwa-192x192.png" alt="СантехПро" style="position:relative;width:96px;height:96px;border-radius:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5),0 8px 10px -6px rgba(0,0,0,0.5);display:block;" />
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <span style="font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">Сантех</span>
          <span style="font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#38bdf8;">Про</span>
        </div>
        <p style="margin:0 0 24px 0;font-size:14px;color:#94a3b8;letter-spacing:0.2px;">Твой карманный помощник по сантехнике</p>
        <div style="width:140px;height:3px;background:rgba(255,255,255,0.1);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,#0284c7,#38bdf8);border-radius:999px;animation:loadingBar 1.2s infinite ease-in-out;"></div>
        </div>

        <!-- Fail-safe diagnostic panel if loading takes > 4.5s or if opened on blocked run.app in Russia -->
        <div id="splash-delayed-help" style="display:none;margin-top:24px;max-width:320px;text-align:center;padding:14px;border-radius:16px;background:rgba(30,41,59,0.9);border:1px solid rgba(56,189,248,0.3);box-shadow:0 10px 25px rgba(0,0,0,0.5);">
          <p id="splash-help-text" style="font-size:12px;color:#cbd5e1;line-height:1.5;margin:0 0 10px 0;">
            Загрузка занимает больше времени, чем обычно...
          </p>
          <div id="splash-runapp-warning" style="display:none;margin-bottom:12px;font-size:11px;color:#fca5a5;background:rgba(239,68,68,0.15);padding:8px 10px;border-radius:8px;border:1px solid rgba(239,68,68,0.3);line-height:1.4;">
            ⚠️ Вы открыли техническую ссылку <b>*.run.app</b>, которая блокируется в РФ. Откройте официальный сайт:
          </div>
          <a id="splash-official-link" href="https://santehpro.info" style="display:none;margin:0 auto 10px auto;background:#0284c7;color:#fff;font-weight:700;font-size:12px;padding:9px 16px;border-radius:10px;text-decoration:none;display:none;">
            Перейти на santehpro.info
          </a>
          <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;">
            <button type="button" onclick="window.location.reload(true)" style="background:#334155;color:#fff;border:none;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;">
              🔄 Обновить
            </button>
            <button type="button" onclick="clearPwaAndReload()" style="background:rgba(239,68,68,0.2);color:#fca5a5;border:1px solid rgba(239,68,68,0.4);padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;">
              🗑️ Очистить кэш
            </button>
          </div>
        </div>

        <script>
          function clearPwaAndReload() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) regs[i].unregister();
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
              });
            }
            setTimeout(function() { window.location.reload(true); }, 300);
          }

          (function() {
            var isRunApp = window.location.hostname.indexOf('run.app') !== -1;
            var timer = setTimeout(function() {
              var splash = document.getElementById('initial-splash');
              if (splash) {
                var help = document.getElementById('splash-delayed-help');
                if (help) help.style.display = 'block';
                if (isRunApp) {
                  var warn = document.getElementById('splash-runapp-warning');
                  var link = document.getElementById('splash-official-link');
                  if (warn) warn.style.display = 'block';
                  if (link) link.style.display = 'inline-block';
                }
              }
            }, isRunApp ? 2500 : 4500);

            window.addEventListener('error', function(e) {
              var splash = document.getElementById('initial-splash');
              if (splash) {
                var help = document.getElementById('splash-delayed-help');
                var text = document.getElementById('splash-help-text');
                if (help) help.style.display = 'block';
                if (text) text.innerText = 'Ошибка инициализации: ' + (e && e.message ? e.message : 'Сбой сети');
              }
            });
          })();
        </script>
        <style>
          @keyframes loadingBar {
            0% { left: -40%; width: 30%; }
            50% { left: 40%; width: 50%; }
            100% { left: 100%; width: 40%; }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
          }
        </style>
      </div>
